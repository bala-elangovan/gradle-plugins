name: Post Release Version Bump

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump minor version
        run: |
          # Read current versions
          MAJOR=$(grep '^major=' gradle.properties | cut -d'=' -f2)
          MINOR=$(grep '^minor=' gradle.properties | cut -d'=' -f2)

          # Bump minor version
          NEW_MINOR=$((MINOR + 1))

          # Update gradle.properties
          sed -i "s/^minor=.*/minor=${NEW_MINOR}/" gradle.properties
          sed -i "s/^patch=.*/patch=0/" gradle.properties

          echo "Bumped version to ${MAJOR}.${NEW_MINOR}.0"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to next development cycle"
          title: "chore: bump version after release"
          body: |
            Automated version bump after release.

            This PR increments the minor version for the next development cycle.
          branch: chore/bump-version
          base: main
